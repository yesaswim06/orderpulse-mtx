version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mtx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orderpulse_mtx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_mtx
    ports:
      - "5432:5432"
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderpulse_mtx"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mtx-matching-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SYMBOL: DEMO
      BREAKER_REFERENCE_PRICE_RUPEES: 100.00
      BREAKER_BAND_PERCENT: 5.0
      BREAKER_HALT_DURATION_SECONDS: 30
      DEMO_ADMIN_TOKEN: demo-admin-secret-mtx-2026
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: orderpulse_mtx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_mtx
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mtx-trading-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
